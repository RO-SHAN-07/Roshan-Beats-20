<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Chat</title>
  <meta name="description" content="Explore chat in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="chat, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/chat.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="chat-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home-chat">🏠 Home</button>
        <button class="nav-btn" id="nav-search-chat">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications-chat">🔔 Notifications</button>
        <button class="nav-btn active" id="nav-chat-chat">💬 Chat</button>
        <button class="nav-btn" id="nav-gallery-chat">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-analytics-chat">📈 Analytics</button>
        <button class="nav-btn" id="nav-help-chat">❓ Help</button>
        <button class="nav-btn" id="nav-privacy-chat">🔒 Privacy</button>
        <button class="nav-btn" id="nav-offline-queue-chat">📶 Offline Queue</button>
        <button class="nav-btn" id="nav-ar-camera-chat">📷 AR Camera</button>
        <button class="nav-btn" id="nav-settings-chat">⚙️ Settings</button>
    </div>
    <h2>Chat</h2>
    <div class="chat-messages" id="chat-messages">
        <div class="message received">Welcome to Roshan Beats support!</div>
    </div>
    <div class="chat-input-container">
        <input type="text" id="chat-input" placeholder="Type a message...">
        <button id="emoji-btn">😊</button>
        <input type="file" id="file-input-chat" style="display:none;" accept="image/*,audio/*,video/*">
        <button id="attach-btn">📎</button>
        <button id="send-btn">Send</button>
    </div>
    <div class="emoji-picker" id="emoji-picker" style="display:none;">
        <span class="emoji" data-emoji="😀">😀</span>
        <span class="emoji" data-emoji="😂">😂</span>
        <span class="emoji" data-emoji="❤️">❤️</span>
        <span class="emoji" data-emoji="👍">👍</span>
        <span class="emoji" data-emoji="🔥">🔥</span>
        <span class="emoji" data-emoji="🎵">🎵</span>
        <!-- Add more emojis as needed -->
    </div>
</div>
</body>
</html>
