<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Map</title>
  <meta name="description" content="Explore map in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="map, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/map.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="map-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home-map">🏠 Home</button>
        <button class="nav-btn" id="nav-search-map">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications-map">🔔 Notifications</button>
        <button class="nav-btn" id="nav-chat-map">💬 Chat</button>
        <button class="nav-btn" id="nav-gallery-map">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-settings-map">⚙️ Settings</button>
        <button class="nav-btn" id="nav-analytics-map">📈 Analytics</button>
        <button class="nav-btn" id="nav-help-map">❓ Help</button>
        <button class="nav-btn" id="nav-privacy-map">🔒 Privacy</button>
        <button class="nav-btn" id="nav-offline-queue-map">📶 Offline Queue</button>
        <button class="nav-btn" id="nav-ar-camera-map">📷 AR Camera</button>
        <button class="nav-btn active" id="nav-map-map">🗺️ Map</button>
    </div>
    <h2>Concert Map</h2>
    <div class="map-container">
        <canvas id="map-canvas" width="300" height="400"></canvas>
        <div class="map-controls">
            <button id="add-pin">Add Concert Pin</button>
            <button id="add-route">Plan Route</button>
            <button id="clear-map">Clear</button>
        </div>
    </div>
</div>
</body>
</html>
