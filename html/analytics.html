<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Analytics</title>
  <meta name="description" content="Explore analytics in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="analytics, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/analytics.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="analytics-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home-analytics">🏠 Home</button>
        <button class="nav-btn" id="nav-playlists-analytics">📂 Playlists</button>
        <button class="nav-btn" id="nav-dashboard-analytics">📊 Dashboard</button>
        <button class="nav-btn" id="nav-profile-analytics">👤 Profile</button>
        <button class="nav-btn" id="nav-search-analytics">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications-analytics">🔔 Notifications</button>
        <button class="nav-btn" id="nav-chat-analytics">💬 Chat</button>
        <button class="nav-btn" id="nav-gallery-analytics">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-map-analytics">🗺️ Map</button>
        <button class="nav-btn" id="nav-calendar-analytics">📅 Calendar</button>
        <button class="nav-btn" id="nav-cart-analytics">🛒 Cart</button>
        <button class="nav-btn" id="nav-payment-analytics">💳 Payment</button>
        <button class="nav-btn" id="nav-feedback-analytics">⭐ Feedback</button>
        <button class="nav-btn active" id="nav-analytics">📈 Analytics</button>
        <button class="nav-btn" id="nav-help-analytics">❓ Help</button>
        <button class="nav-btn" id="nav-privacy-analytics">🔒 Privacy</button>
        <button class="nav-btn" id="nav-offline-queue-analytics">📶 Offline Queue</button>
        <button class="nav-btn" id="nav-ar-camera-analytics">📷 AR Camera</button>
        <button class="nav-btn" id="nav-settings-analytics">⚙️ Settings</button>
    </div>
    <h2>Analytics</h2>
    <div class="analytics-content">
        <canvas id="analytics-chart" width="300" height="200"></canvas>
        <div class="analytics-stats">
            <div class="stat">Total Plays: <span id="total-plays">0</span></div>
            <div class="stat">Top Genre: <span id="top-genre">N/A</span></div>
            <div class="stat">Avg Session: <span id="avg-session">0 min</span></div>
        </div>
    </div>
</div>
</body>
</html>
