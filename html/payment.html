<div id="payment-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home-payment">🏠 Home</button>
        <button class="nav-btn" id="nav-search-payment">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications-payment">🔔 Notifications</button>
        <button class="nav-btn" id="nav-chat-payment">💬 Chat</button>
        <button class="nav-btn" id="nav-gallery-payment">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-settings-payment">⚙️ Settings</button>
        <button class="nav-btn" id="nav-map-payment">🗺️ Map</button>
        <button class="nav-btn" id="nav-calendar-payment">📅 Calendar</button>
        <button class="nav-btn" id="nav-cart-payment">🛒 Cart</button>
        <button class="nav-btn" id="nav-analytics-payment">📈 Analytics</button>
        <button class="nav-btn" id="nav-help-payment">❓ Help</button>
        <button class="nav-btn" id="nav-privacy-payment">🔒 Privacy</button>
        <button class="nav-btn" id="nav-offline-queue-payment">📶 Offline Queue</button>
        <button class="nav-btn" id="nav-ar-camera-payment">📷 AR Camera</button>
        <button class="nav-btn active" id="nav-payment-payment">💳 Payment</button>
    </div>
    <h2>Secure Payment</h2>
    <div class="payment-container">
        <form class="payment-form" id="payment-form">
            <input type="text" placeholder="Card Number" id="card-number" maxlength="19">
            <input type="text" placeholder="MM/YY" id="expiry" maxlength="5">
            <input type="text" placeholder="CVV" id="cvv" maxlength="3">
            <input type="text" placeholder="Name on Card" id="card-name">
            <button type="submit">Pay Now</button>
        </form>
    </div>
</div>
