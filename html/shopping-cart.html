<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Shopping Cart</title>
  <meta name="description" content="Explore shopping cart in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="shopping cart, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/shopping-cart.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="cart-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home-cart">🏠 Home</button>
        <button class="nav-btn" id="nav-search-cart">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications-cart">🔔 Notifications</button>
        <button class="nav-btn" id="nav-chat-cart">💬 Chat</button>
        <button class="nav-btn" id="nav-gallery-cart">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-settings-cart">⚙️ Settings</button>
        <button class="nav-btn" id="nav-map-cart">🗺️ Map</button>
        <button class="nav-btn" id="nav-calendar-cart">📅 Calendar</button>
        <button class="nav-btn" id="nav-analytics-cart">📈 Analytics</button>
        <button class="nav-btn" id="nav-help-cart">❓ Help</button>
        <button class="nav-btn" id="nav-privacy-cart">🔒 Privacy</button>
        <button class="nav-btn" id="nav-offline-queue-cart">📶 Offline Queue</button>
        <button class="nav-btn" id="nav-ar-camera-cart">📷 AR Camera</button>
        <button class="nav-btn active" id="nav-cart-cart">🛒 Cart</button>
    </div>
    <h2>Music Store Cart</h2>
    <div class="cart-container">
        <div class="cart-items" id="cart-items">
            <!-- Cart items -->
        </div>
        <div class="cart-total">
            <p>Total: $<span id="cart-total">0.00</span></p>
            <button id="checkout">Checkout</button>
        </div>
    </div>
</div>
</body>
</html>
