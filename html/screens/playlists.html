<div id="playlists-screen" class="screen">
    <header class="screen-header">
        <h1 class="screen-title">Playlists</h1>
        <button class="icon-btn" id="create-playlist-btn" aria-label="Create playlist">➕</button>
    </header>
    <div class="content-area">
        <div class="empty-state" id="playlists-empty">
            <div class="empty-icon">📂</div>
            <h2>No playlists yet</h2>
            <p>Create your first playlist to organize your music</p>
            <button class="elevated-btn" id="create-first-playlist">Create Your First</button>
        </div>
        <div class="playlist-grid" id="playlist-grid">
            <!-- Playlists will be populated as cards -->
        </div>
    </div>
</div>
