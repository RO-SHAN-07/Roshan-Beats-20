<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Profile</title>
  <meta name="description" content="Explore profile in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="profile, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/profile.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="profile-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home5">🏠 Home</button>
        <button class="nav-btn" id="nav-dashboard2">📊 Dashboard</button>
        <button class="nav-btn active" id="nav-profile2">👤 Profile</button>
        <button class="nav-btn" id="nav-search2">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications2">🔔 Notifications</button>
        <button class="nav-btn" id="nav-chat2">💬 Chat</button>
        <button class="nav-btn" id="nav-gallery2">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-analytics2">📈 Analytics</button>
        <button class="nav-btn" id="nav-help2">❓ Help</button>
        <button class="nav-btn" id="nav-privacy2">🔒 Privacy</button>
        <button class="nav-btn" id="nav-offline-queue2">📶 Offline Queue</button>
        <button class="nav-btn" id="nav-ar-camera2">📷 AR Camera</button>
        <button class="nav-btn" id="nav-settings2">⚙️ Settings</button>
    </div>
    <h2>Profile</h2>
    <div class="profile-content">
        <div class="profile-avatar">
            <img id="profile-pic" src="" alt="Profile Picture">
            <button id="change-pic">Change Picture</button>
        </div>
        <form class="profile-form" id="profile-form">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your Name">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your@email.com">
            <label for="bio">Bio</label>
            <textarea id="bio" placeholder="Tell us about yourself"></textarea>
            <button type="submit" class="save-btn">Save Changes</button>
        </form>
    </div>
</div>
</body>
</html>
