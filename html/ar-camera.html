<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Ar Camera</title>
  <meta name="description" content="Explore ar camera in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="ar camera, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/ar-camera.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="ar-camera-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home-ar">🏠 Home</button>
        <button class="nav-btn" id="nav-playlists-ar">📂 Playlists</button>
        <button class="nav-btn" id="nav-dashboard-ar">📊 Dashboard</button>
        <button class="nav-btn" id="nav-profile-ar">👤 Profile</button>
        <button class="nav-btn" id="nav-search-ar">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications-ar">🔔 Notifications</button>
        <button class="nav-btn" id="nav-chat-ar">💬 Chat</button>
        <button class="nav-btn" id="nav-gallery-ar">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-map-ar">🗺️ Map</button>
        <button class="nav-btn" id="nav-calendar-ar">📅 Calendar</button>
        <button class="nav-btn" id="nav-cart-ar">🛒 Cart</button>
        <button class="nav-btn" id="nav-payment-ar">💳 Payment</button>
        <button class="nav-btn" id="nav-feedback-ar">⭐ Feedback</button>
        <button class="nav-btn" id="nav-analytics-ar">📈 Analytics</button>
        <button class="nav-btn" id="nav-help-ar">❓ Help</button>
        <button class="nav-btn" id="nav-privacy-ar">🔒 Privacy</button>
        <button class="nav-btn" id="nav-offline-queue-ar">📶 Offline Queue</button>
        <button class="nav-btn active" id="nav-ar-camera">📷 AR Camera</button>
        <button class="nav-btn" id="nav-settings-ar">⚙️ Settings</button>
    </div>
    <h2>AR Camera</h2>
    <div class="ar-content">
        <video id="ar-video" autoplay playsinline></video>
        <canvas id="ar-overlay"></canvas>
        <div class="ar-controls">
            <button id="start-ar">Start AR</button>
            <button id="stop-ar">Stop AR</button>
            <button id="add-overlay">Add Overlay</button>
            <button id="capture-ar">Capture AR Photo</button>
        </div>
    </div>
</div>
</body>
</html>
