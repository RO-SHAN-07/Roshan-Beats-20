<div id="login-screen" class="screen">
    <div class="login-content">
        <h2>Login to Roshan Beats</h2>
        <form class="login-form" id="login-form">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="login-btn">Login</button>
        </form>
        <div class="social-login">
            <button class="social-btn google-btn" id="google-login">Login with Google</button>
            <button class="social-btn facebook-btn" id="facebook-login">Login with Facebook</button>
            <button class="social-btn apple-btn" id="apple-login">Login with Apple</button>
        </div>
        <p>Don't have an account? <a href="#" id="signup-link">Sign up</a></p>
    </div>
</div>
