<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Login</title>
  <meta name="description" content="Explore login in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="login, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/login.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="login-screen" class="screen">
    <div class="login-content">
        <h2>Login to Roshan Beats</h2>
        <div class="auth-options">
            <button class="biometric-btn" id="biometric-login" aria-label="Login with biometric authentication">
                <span class="biometric-icon">👆</span>
                Use Fingerprint/Face ID
            </button>
        </div>
        <div class="divider">
            <span>or</span>
        </div>
        <form class="login-form" id="login-form">
            <input type="email" placeholder="Email" required aria-label="Email address">
            <input type="password" placeholder="Password" required aria-label="Password">
            <button type="submit" class="login-btn">Login</button>
        </form>
        <div class="social-login">
            <button class="social-btn google-btn" id="google-login" aria-label="Login with Google">Login with Google</button>
            <button class="social-btn facebook-btn" id="facebook-login" aria-label="Login with Facebook">Login with Facebook</button>
            <button class="social-btn apple-btn" id="apple-login" aria-label="Login with Apple">Login with Apple</button>
        </div>
        <p>Don't have an account? <a href="#" id="signup-link">Sign up</a></p>
    </div>
</div>

<script>
document.getElementById('biometric-login').addEventListener('click', async () => {
    // Check device capabilities with Capacitor Device plugin
    let deviceInfo = null;
    let hasBiometrics = false;

    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Device) {
        const { Device } = window.Capacitor.Plugins;
        deviceInfo = await Device.getInfo();
        console.log('Device info:', deviceInfo);

        // Check if device supports biometrics (Android specific)
        if (deviceInfo.platform === 'android') {
            // On Android, check if fingerprint/face unlock is available
            hasBiometrics = deviceInfo.isVirtual ? false : true; // Simplified check
        }
    }

    if (!window.PublicKeyCredential && !hasBiometrics) {
        alert('Biometric authentication not supported on this device');
        return;
    }

    try {
        // First, check if user has registered biometrics
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const credentialRequestOptions = {
            challenge: challenge,
            allowCredentials: [], // Will be populated if user has registered
            userVerification: 'preferred',
        };

        // Try to get existing credential
        const assertion = await navigator.credentials.get({
            publicKey: credentialRequestOptions
        });

        if (assertion) {
            // Verify the assertion with server
            console.log('Biometric authentication successful:', assertion);
            alert('Login successful with biometrics!');
            // Redirect to home or set logged in state
            window.location.href = 'home.html';
        }

    } catch (error) {
        if (error.name === 'NotAllowedError') {
            // User hasn't registered biometrics yet, offer to register
            await registerBiometrics();
        } else {
            console.error('Biometric login failed:', error);
            // Fallback to other authentication methods
            showFallbackAuth();
        }
    }
});

async function registerBiometrics() {
    try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const userId = new Uint8Array(16);
        window.crypto.getRandomValues(userId);

        const publicKeyCredentialCreationOptions = {
            challenge: challenge,
            rp: {
                name: 'Roshan Beats',
                id: window.location.hostname,
            },
            user: {
                id: userId,
                name: 'user@roshanbeats.com', // Would be actual user email
                displayName: 'Roshan Beats User',
            },
            pubKeyCredParams: [
                { alg: -7, type: 'public-key' }, // ES256
                { alg: -257, type: 'public-key' }, // RS256
            ],
            authenticatorSelection: {
                authenticatorAttachment: 'platform',
                userVerification: 'preferred',
                requireResidentKey: false,
            },
            timeout: 60000,
            attestation: 'direct',
        };

        const credential = await navigator.credentials.create({
            publicKey: publicKeyCredentialCreationOptions
        });

        // Send credential to server for storage
        console.log('Biometric registration successful:', credential);

        alert('Biometric authentication registered! You can now login with fingerprint/face.');

    } catch (error) {
        console.error('Biometric registration failed:', error);
        // Fallback to other methods
        showFallbackAuth();
    }
}

function showFallbackAuth() {
    // Show alternative authentication methods
    const fallbackOptions = document.createElement('div');
    fallbackOptions.id = 'fallback-auth';
    fallbackOptions.innerHTML = `
        <h3>Alternative Login Methods</h3>
        <button class="auth-fallback-btn" id="pin-login">Use PIN Code</button>
        <button class="auth-fallback-btn" id="sms-login">Send SMS Code</button>
        <button class="auth-fallback-btn" id="email-login">Send Email Code</button>
    `;

    const existingFallback = document.getElementById('fallback-auth');
    if (existingFallback) {
        existingFallback.remove();
    }

    document.querySelector('.auth-options').appendChild(fallbackOptions);

    // Add event listeners for fallback methods
    document.getElementById('pin-login').addEventListener('click', () => {
        const pin = prompt('Enter your 4-digit PIN:');
        if (pin && pin.length === 4) {
            alert('PIN login successful!');
            window.location.href = 'home.html';
        } else {
            alert('Invalid PIN');
        }
    });

    document.getElementById('sms-login').addEventListener('click', () => {
        const phone = prompt('Enter your phone number:');
        if (phone) {
            alert('SMS code sent! (Mock implementation)');
            const code = prompt('Enter SMS code:');
            if (code) {
                alert('SMS login successful!');
                window.location.href = 'home.html';
            }
        }
    });

    document.getElementById('email-login').addEventListener('click', () => {
        const email = prompt('Enter your email:');
        if (email) {
            alert('Email code sent! (Mock implementation)');
            const code = prompt('Enter email code:');
            if (code) {
                alert('Email login successful!');
                window.location.href = 'home.html';
            }
        }
    });
}

// Handle traditional login form
document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    // Mock login
    alert('Login successful!');
    window.location.href = 'home.html';
});

// Social login placeholders
document.getElementById('google-login').addEventListener('click', () => {
    alert('Google login not implemented');
});

document.getElementById('facebook-login').addEventListener('click', () => {
    alert('Facebook login not implemented');
});

document.getElementById('apple-login').addEventListener('click', () => {
    alert('Apple login not implemented');
});
</script>
</body>
</html>
