<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Privacy</title>
  <meta name="description" content="Explore privacy in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="privacy, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/privacy.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="privacy-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home-privacy">🏠 Home</button>
        <button class="nav-btn" id="nav-playlists-privacy">📂 Playlists</button>
        <button class="nav-btn" id="nav-dashboard-privacy">📊 Dashboard</button>
        <button class="nav-btn" id="nav-profile-privacy">👤 Profile</button>
        <button class="nav-btn" id="nav-search-privacy">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications-privacy">🔔 Notifications</button>
        <button class="nav-btn" id="nav-chat-privacy">💬 Chat</button>
        <button class="nav-btn" id="nav-gallery-privacy">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-map-privacy">🗺️ Map</button>
        <button class="nav-btn" id="nav-calendar-privacy">📅 Calendar</button>
        <button class="nav-btn" id="nav-cart-privacy">🛒 Cart</button>
        <button class="nav-btn" id="nav-payment-privacy">💳 Payment</button>
        <button class="nav-btn" id="nav-feedback-privacy">⭐ Feedback</button>
        <button class="nav-btn" id="nav-analytics-privacy">📈 Analytics</button>
        <button class="nav-btn" id="nav-help-privacy">❓ Help</button>
        <button class="nav-btn active" id="nav-privacy">🔒 Privacy</button>
        <button class="nav-btn" id="nav-offline-queue-privacy">📶 Offline Queue</button>
        <button class="nav-btn" id="nav-ar-camera-privacy">📷 AR Camera</button>
        <button class="nav-btn" id="nav-settings-privacy">⚙️ Settings</button>
    </div>
    <h2>Privacy Settings</h2>
    <div class="privacy-content">
        <div class="settings-section">
            <h3>Data Consent</h3>
            <div class="setting-item">
                <label>Share Listening Data for Recommendations</label>
                <input type="checkbox" id="share-listening-data">
            </div>
            <div class="setting-item">
                <label>Allow Analytics Tracking</label>
                <input type="checkbox" id="allow-analytics">
            </div>
            <div class="setting-item">
                <label>Enable Location Services</label>
                <input type="checkbox" id="enable-location">
            </div>
            <div class="setting-item">
                <label>Share Data with Third Parties</label>
                <input type="checkbox" id="share-third-party">
            </div>
        </div>
        <button class="save-btn" id="save-privacy">Save Privacy Settings</button>
    </div>
</div>
</body>
</html>
