<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Gallery</title>
  <meta name="description" content="Explore gallery in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="gallery, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/gallery.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="gallery-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home-gallery">🏠 Home</button>
        <button class="nav-btn" id="nav-search-gallery">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications-gallery">🔔 Notifications</button>
        <button class="nav-btn" id="nav-chat-gallery">💬 Chat</button>
        <button class="nav-btn active" id="nav-gallery-gallery">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-analytics-gallery">📈 Analytics</button>
        <button class="nav-btn" id="nav-help-gallery">❓ Help</button>
        <button class="nav-btn" id="nav-privacy-gallery">🔒 Privacy</button>
        <button class="nav-btn" id="nav-offline-queue-gallery">📶 Offline Queue</button>
        <button class="nav-btn" id="nav-ar-camera-gallery">📷 AR Camera</button>
        <button class="nav-btn" id="nav-settings-gallery">⚙️ Settings</button>
    </div>
    <h2>Gallery</h2>
    <button class="import-btn" id="upload-media">Upload Media</button>
    <input type="file" id="media-input" multiple accept="image/*,video/*,audio/*" style="display:none;">
    <div class="media-grid" id="media-grid">
        <!-- Media previews will be populated here -->
    </div>
</div>
</body>
</html>
