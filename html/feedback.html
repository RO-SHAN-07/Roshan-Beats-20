<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Roshan Beats - Feedback</title>
  <meta name="description" content="Explore feedback in Roshan Beats, your advanced music player PWA.">
  <meta name="keywords" content="feedback, music player, Roshan Beats">
  <link rel="canonical" href="https://roshanbeats.com/html/feedback.html">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="feedback-screen" class="screen">
    <div class="nav-bar">
        <button class="nav-btn" id="nav-home-feedback">🏠 Home</button>
        <button class="nav-btn" id="nav-search-feedback">🔍 Search</button>
        <button class="nav-btn" id="nav-notifications-feedback">🔔 Notifications</button>
        <button class="nav-btn" id="nav-chat-feedback">💬 Chat</button>
        <button class="nav-btn" id="nav-gallery-feedback">🖼️ Gallery</button>
        <button class="nav-btn" id="nav-settings-feedback">⚙️ Settings</button>
        <button class="nav-btn" id="nav-map-feedback">🗺️ Map</button>
        <button class="nav-btn" id="nav-calendar-feedback">📅 Calendar</button>
        <button class="nav-btn" id="nav-cart-feedback">🛒 Cart</button>
        <button class="nav-btn" id="nav-payment-feedback">💳 Payment</button>
        <button class="nav-btn active" id="nav-feedback-feedback">⭐ Feedback</button>
    </div>
    <h2>App Feedback</h2>
    <div class="feedback-container">
        <div class="rating">
            <span>Rate us:</span>
            <div class="stars" id="stars">
                <span class="star" data-rating="1">⭐</span>
                <span class="star" data-rating="2">⭐</span>
                <span class="star" data-rating="3">⭐</span>
                <span class="star" data-rating="4">⭐</span>
                <span class="star" data-rating="5">⭐</span>
            </div>
        </div>
        <textarea id="review" placeholder="Write your review..."></textarea>
        <button id="submit-feedback">Submit</button>
    </div>
</div>
</body>
</html>
