    <!-- Error States -->
    <div class="error-state" id="playlists-load-error" style="display: none;">
        <div class="error-icon">💥</div>
        <h2>Unable to Load Playlists</h2>
        <p>Failed to load your playlists. Please try again.</p>
        <button class="outlined-btn" id="retry-load-playlists">Retry</button>
    </div>

    <div class="error-state" id="playlist-create-error" style="display: none;">
        <div class="error-icon">❌</div>
</div>

        <h2>Failed to Create Playlist</h2>
        <p id="playlist-create-error-message">Unable to create playlist</p>
        <button class="outlined-btn" id="retry-create-playlist">Try Again</button>
    </div>

    <!-- Loading States -->
    <div class="loading-state" id="playlists-loading" style="display: none;">
        <div class="spinner"></div>
        <p>Loading your playlists...</p>
    </div>

    <!-- Empty States -->
    <div class="empty-state" id="playlists-empty" style="display: none;">
        <div class="empty-icon">📂</div>
        <h2>No playlists yet</h2>
        <p>Create playlists to organize your music collection</p>
        <div class="empty-actions">
            <button class="elevated-btn" id="create-first-playlist">Create Your First</button>
            <button class="outlined-btn" id="playlist-tutorial">How to Create</button>
        </div>
    </div>

    <div class="playlist-list" id="playlist-list">
        <!-- Playlists will be populated here -->
    </div>
